<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>All Men Store | Sorteio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
  overflow: hidden;
}

/* FUNDO */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://picsum.photos/800/1600?blur=3') center/cover;
  filter: brightness(0.3);
}

/* PAINEL */
.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9);
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  color: #c2a27c;
  width: 320px;
  box-shadow: 0 0 30px rgba(194,162,124,0.2);
}

/* LOGO */
.logo {
  width: 120px;
  margin-bottom: 20px;
}

/* ROLETA */
.roleta {
  height: 100px;
  overflow: hidden;
  margin: 20px 0;
  position: relative;
  border-top: 1px solid #c2a27c33;
  border-bottom: 1px solid #c2a27c33;
}

/* LINHA CENTRAL */
.roleta::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  background: gold;
  transform: translateY(-50%);
}

.lista {
  position: relative;
}

.item {
  height: 100px;
  font-size: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTAGEM */
.countdown {
  font-size: 50px;
  margin: 10px 0;
  display: none;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* BOTÃO */
button {
  padding: 12px 40px;
  background: #c2a27c;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="modal">

  <img src="logo.png" class="logo">

  <div class="countdown" id="count">3</div>

  <div class="roleta">
    <div class="lista" id="lista"></div>
  </div>

  <button onclick="iniciar()">SORTEAR</button>

</div>

<audio id="somFinal" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>

let numeros = [];
for (let i = 501; i <= 567; i++) numeros.push(i);

let lista = document.getElementById("lista");

let rodando = false;

/* GERAR LISTA */
function gerarLista() {
  lista.innerHTML = "";
  for (let i = 0; i < 50; i++) {
    let n = numeros[Math.floor(Math.random()*numeros.length)];
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = n;
    lista.appendChild(div);
  }
}

gerarLista();

/* INICIAR */
function iniciar() {

  if (rodando) return;
  rodando = true;

  let count = document.getElementById("count");
  count.style.display = "block";

  let tempo = 3;
  count.innerText = tempo;

  let intervalo = setInterval(() => {
    tempo--;

    if (tempo > 0) {
      count.innerText = tempo;
    } else {
      clearInterval(intervalo);
      count.style.display = "none";
      sortear();
    }
  }, 1000);
}

/* SORTEIO */
function sortear() {

  gerarLista();

  let final = numeros[Math.floor(Math.random()*numeros.length)];

  let itens = document.querySelectorAll(".item");

  let index = 0;
  itens.forEach((el, i) => {
    if (parseInt(el.innerText) === final && index === 0) {
      index = i;
    }
  });

  let target = index * 100;

  let extra = 3000; // giro fake
  let pos = target + extra;

  // SOM DE GIRO
  let audioGiro = new Audio("https://www.soundjay.com/mechanical/sounds/slot-machine-1.mp3");
  audioGiro.play();

  lista.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
  lista.style.transform = `translateY(-${pos}px)`;

  setTimeout(() => {
    document.getElementById("somFinal").play();
    rodando = false;
  }, 4000);
}

</script>

</body>
</html>
