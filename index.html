<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>All Men Store | Sorteio</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111, #000);
  font-family: Arial, sans-serif;
  color: #d2b48c;
  text-align: center;
}

.container {
  margin-top: 60px;
}

.logo {
  width: 180px;
  margin-bottom: 10px;
}

.live {
  color: red;
  font-size: 14px;
  margin-bottom: 10px;
  animation: piscar 1s infinite;
}

@keyframes piscar {
  0% {opacity: 1;}
  50% {opacity: 0.3;}
  100% {opacity: 1;}
}

.participantes {
  font-size: 14px;
  margin-bottom: 20px;
  color: #aaa;
}

.numero {
  font-size: 120px;
  margin: 40px 0;
  font-weight: bold;
  letter-spacing: 15px;
  color: #d2b48c;
  text-shadow: 0 0 25px rgba(210,180,140,0.8);
  transition: transform 0.2s;
}

.numero.animando {
  transform: scale(1.1);
}

button {
  padding: 15px 60px;
  font-size: 18px;
  background: linear-gradient(45deg, #d2b48c, #c19a6b);
  color: black;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: 0.2s;
}

button:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <div class="live">🔴 AO VIVO</div>

  <div class="participantes" id="pessoas">847 participantes</div>

  <div class="numero" id="numero">000</div>

  <button onclick="sortear()">SORTear</button>

</div>

<audio id="som" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>

let numeros = [];
for (let i = 501; i <= 567; i++) numeros.push(i);

let modoAdmin = false;
let resultadoForcado = null;

// contador fake dinâmico
setInterval(() => {
  let base = 800 + Math.floor(Math.random() * 100);
  document.getElementById("pessoas").innerText = base + " participantes";
}, 3000);

// modo secreto
let segredo = 0;
document.getElementById("numero").onclick = () => {
  segredo++;
  if (segredo >= 6) {
    let senha = prompt("Senha:");
    if (senha === "allmen2026") {
      modoAdmin = true;
      let num = prompt("Número vencedor:");
      if (num) resultadoForcado = parseInt(num);
      alert("Modo admin ativado");
    }
  }
};

function animacao(callback) {
  let contador = 0;
  let velocidade = 20;

  document.getElementById("numero").classList.add("animando");

  let loop = setInterval(() => {
    let fake = Math.floor(Math.random() * 999);
    document.getElementById("numero").innerText =
      fake.toString().padStart(3, '0');

    contador++;

    if (contador > 40) velocidade += 5;
    if (contador > 80) velocidade += 10;

    if (contador > 120) {
      clearInterval(loop);
      document.getElementById("numero").classList.remove("animando");
      callback();
    }
  }, velocidade);
}

function sortear() {
  animacao(() => {

    let final;

    if (modoAdmin && resultadoForcado) {
      final = resultadoForcado;
    } else {
      final = numeros[Math.floor(Math.random() * numeros.length)];
    }

    document.getElementById("numero").innerText = final;
    document.getElementById("som").play();
  });
}

</script>

</body>
</html>
