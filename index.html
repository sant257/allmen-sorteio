<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>All Men Store | Sorteio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
  overflow: hidden;
}

/* FUNDO FAKE INSTAGRAM */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://picsum.photos/800/1600?blur=3') center/cover;
  filter: brightness(0.3);
}

/* PAINEL CENTRAL */
.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  color: #c2a27c;
  width: 320px;
}

/* LOGO */
.logo {
  width: 120px;
  margin-bottom: 20px;
}

/* ROLETA */
.roleta {
  height: 100px;
  overflow: hidden;
  border-top: 1px solid #c2a27c33;
  border-bottom: 1px solid #c2a27c33;
  margin: 20px 0;
}

.lista {
  position: relative;
}

.item {
  height: 100px;
  font-size: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTAGEM */
.countdown {
  font-size: 40px;
  margin: 10px 0;
  display: none;
}

/* BOTÃO */
button {
  padding: 12px 40px;
  background: #c2a27c;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="modal">

  <img src="logo.png" class="logo">

  <div class="countdown" id="count">3</div>

  <div class="roleta">
    <div class="lista" id="lista"></div>
  </div>

  <button onclick="iniciar()">SORTEAR</button>

</div>

<audio id="som" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>

let numeros = [];
for (let i = 501; i <= 567; i++) numeros.push(i);

let lista = document.getElementById("lista");

function gerarLista() {
  lista.innerHTML = "";
  for (let i = 0; i < 40; i++) {
    let n = numeros[Math.floor(Math.random()*numeros.length)];
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = n;
    lista.appendChild(div);
  }
}

gerarLista();

function iniciar() {

  let count = document.getElementById("count");
  count.style.display = "block";

  let tempo = 3;

  let intervalo = setInterval(() => {
    tempo--;
    count.innerText = tempo;

    if (tempo == 0) {
      clearInterval(intervalo);
      count.style.display = "none";
      sortear();
    }
  }, 1000);
}

function sortear() {

  gerarLista();

  let final = numeros[Math.floor(Math.random()*numeros.length)];

  let itens = document.querySelectorAll(".item");

  // encontra posição do número final
  let index = 0;
  itens.forEach((el, i) => {
    if (parseInt(el.innerText) === final && index === 0) {
      index = i;
    }
  });

  let target = index * 100;

  // começa longe pra dar efeito
  let pos = target + 2000;

  lista.style.transition = "transform 3s cubic-bezier(0.1, 0.7, 0.1, 1)";
  lista.style.transform = `translateY(-${pos}px)`;

  setTimeout(() => {
    lista.style.transition = "transform 1.5s ease-out";
    lista.style.transform = `translateY(-${target}px)`;

    document.getElementById("som").play();
  }, 3000);
}

</script>

</body>
</html>
