<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>All Men Store | Sorteio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
  overflow: hidden;
}

/* FUNDO INSTAGRAM REAL */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.feed {
  position: absolute;
  width: 100%;
  animation: scrollFeed 30s linear infinite;
}

.post {
  width: 100%;
  height: 300px;
  background-size: cover;
  background-position: center;
  margin-bottom: 10px;
  border-radius: 10px;
  filter: brightness(0.4);
}

@keyframes scrollFeed {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* PAINEL */
.modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  border-radius: 12px;
  padding: 30px;
  text-align: center;
  color: #c2a27c;
  width: 320px;
  z-index: 10;
}

.logo {
  width: 120px;
  margin-bottom: 20px;
}

/* ROLETA */
.roleta {
  height: 100px;
  overflow: hidden;
  margin: 20px 0;
}

.item {
  height: 100px;
  font-size: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTAGEM */
.countdown {
  font-size: 50px;
  display: none;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.3); }
}

/* BOTÃO */
button {
  padding: 12px 40px;
  background: #c2a27c;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="bg">
  <div class="feed" id="feed"></div>
</div>

<div class="modal">
  <img src="logo.png" class="logo">
  <div class="countdown" id="count">3</div>

  <div class="roleta">
    <div id="lista"></div>
  </div>

  <button onclick="iniciar()">SORTEAR</button>
</div>

<audio id="somFinal" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>

/* =========================
   INSTAGRAM AUTOMÁTICO
========================= */

const username = "allmenstore.oficial";

// API pública que converte Instagram → JSON
const url = `https://api.rss2json.com/v1/api.json?rss_url=https://rsshub.app/instagram/user/${username}`;

fetch(url)
  .then(res => res.json())
  .then(data => {
    const feed = document.getElementById("feed");

    data.items.slice(0, 10).forEach(item => {
      const img = item.thumbnail;

      let div = document.createElement("div");
      div.className = "post";
      div.style.backgroundImage = `url(${img})`;

      feed.appendChild(div);
    });

    // duplica pra rolagem infinita
    feed.innerHTML += feed.innerHTML;
  });

/* =========================
   ROLETA
========================= */

let numeros = [];
for (let i = 501; i <= 567; i++) numeros.push(i);

let lista = document.getElementById("lista");
let rodando = false;

function gerarLista() {
  lista.innerHTML = "";
  for (let i = 0; i < 50; i++) {
    let n = numeros[Math.floor(Math.random()*numeros.length)];
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = n;
    lista.appendChild(div);
  }
}

gerarLista();

function iniciar() {

  if (rodando) return;
  rodando = true;

  let count = document.getElementById("count");
  count.style.display = "block";

  let tempo = 3;
  count.innerText = tempo;

  let intervalo = setInterval(() => {
    tempo--;

    if (tempo > 0) {
      count.innerText = tempo;
    } else {
      clearInterval(intervalo);
      count.style.display = "none";
      sortear();
    }
  }, 1000);
}

function sortear() {

  gerarLista();

  let final = numeros[Math.floor(Math.random()*numeros.length)];

  let itens = document.querySelectorAll(".item");

  let index = 0;
  itens.forEach((el, i) => {
    if (parseInt(el.innerText) === final && index === 0) {
      index = i;
    }
  });

  let target = index * 100;
  let pos = target + 3000;

  let audioGiro = new Audio("https://www.soundjay.com/mechanical/sounds/slot-machine-1.mp3");
  audioGiro.play();

  lista.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
  lista.style.transform = `translateY(-${pos}px)`;

  setTimeout(() => {
    document.getElementById("somFinal").play();
    rodando = false;
  }, 4000);
}

</script>

</body>
</html>
