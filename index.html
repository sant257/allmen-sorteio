<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>All Men Store | Sorteio</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #111, #000 70%);
  font-family: Arial, sans-serif;
  color: #c2a27c;
  text-align: center;
}

.container {
  margin-top: 80px;
}

.logo {
  width: 180px;
  margin-bottom: 30px;
}

/* CAIXA DA ROLETA */
.roleta {
  height: 120px;
  overflow: hidden;
  position: relative;
  margin: 40px auto;
  width: 300px;
  border-top: 2px solid rgba(194,162,124,0.3);
  border-bottom: 2px solid rgba(194,162,124,0.3);
}

/* LISTA DE NÚMEROS */
.lista {
  position: absolute;
  width: 100%;
  top: 0;
}

.item {
  height: 120px;
  font-size: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 10px;
  text-shadow: 0 0 15px rgba(194,162,124,0.5);
}

button {
  padding: 15px 60px;
  font-size: 18px;
  background: linear-gradient(45deg, #c2a27c, #a88b67);
  color: #000;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.png" class="logo">

  <div class="roleta">
    <div class="lista" id="lista"></div>
  </div>

  <button onclick="sortear()">SORTear</button>

</div>

<audio id="som" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>

// números válidos
let numeros = [];
for (let i = 501; i <= 567; i++) numeros.push(i);

// cria lista visual (repete para dar efeito de rolagem)
let lista = document.getElementById("lista");

function gerarLista() {
  lista.innerHTML = "";
  for (let i = 0; i < 30; i++) {
    let num = numeros[Math.floor(Math.random() * numeros.length)];
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = num;
    lista.appendChild(div);
  }
}

gerarLista();

// modo secreto
let modoAdmin = false;
let resultadoForcado = null;

document.body.addEventListener("dblclick", () => {
  let senha = prompt("Senha:");
  if (senha === "allmen2026") {
    modoAdmin = true;
    let num = prompt("Número vencedor:");
    if (num) resultadoForcado = parseInt(num);
    alert("Modo admin ativado");
  }
});

function sortear() {

  gerarLista();

  let pos = 0;
  let velocidade = 40;
  let desacelerando = false;

  let final;

  if (modoAdmin && resultadoForcado) {
    final = resultadoForcado;
  } else {
    final = numeros[Math.floor(Math.random() * numeros.length)];
  }

  let loop = setInterval(() => {

    pos -= velocidade;
    lista.style.top = pos + "px";

    if (pos < -2000 && !desacelerando) {
      desacelerando = true;
    }

    if (desacelerando) {
      velocidade *= 0.95;
    }

    // parar exatamente no número final
    let itens = document.querySelectorAll(".item");
    itens.forEach((el, i) => {
      if (parseInt(el.innerText) === final && velocidade < 2) {
        clearInterval(loop);
        lista.style.top = (-i * 120) + "px";
        document.getElementById("som").play();
      }
    });

  }, 30);
}

</script>

</body>
</html>
